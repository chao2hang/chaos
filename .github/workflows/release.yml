name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without leading v (default: 0.1.0)"
        required: false
        default: "0.1.20"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            dae_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            dae_arch: arm64
    runs-on: ${{ matrix.os }}
    # Build inside Debian 12 so the shipped binaries link against glibc 2.36
    # and run on bookworm out of the box (a bare ubuntu-latest build would
    # require glibc 2.39 and break Debian 12 hosts). glibc of the container
    # (2.36) matches the Docker runtime image (bookworm-slim).
    container: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev dpkg-dev curl ca-certificates unzip xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Fetch dae (${{ matrix.dae_arch }})
        run: CHAOS_DAE_ARCH=${{ matrix.dae_arch }} ./scripts/fetch-dae.sh

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for ${{ matrix.arch }}"

      - name: Build package
        env:
          CHAOS_ARCH: ${{ matrix.arch }}
          CHAOS_VERSION: ${{ steps.ver.outputs.version }}
        run: ./packaging/debian/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ matrix.arch }}
          path: |
            dist/chaos_*.deb
            dist/chaos_*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'chaos_*.deb' -o -name 'chaos_*.tar.gz' \) -exec cp -v {} release/ \;
          cd release
          sha256sum chaos_*.deb chaos_*.tar.gz > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
