name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (default: tag or 0.1.0)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            dae_arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            dae_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Fetch dae (${{ matrix.dae_arch }})
        run: CHAOS_DAE_ARCH=${{ matrix.dae_arch }} ./scripts/fetch-dae.sh

      - name: Build package
        env:
          CHAOS_ARCH: ${{ matrix.arch }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.1.0"
          fi
          VERSION="${VERSION#v}"
          CHAOS_VERSION="$VERSION" CHAOS_ARCH="${{ matrix.arch }}" ./packaging/debian/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ matrix.arch }}
          path: |
            dist/chaos_*.deb
            dist/chaos_*.tar.gz
            dist/SHA256SUMS

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'chaos_*.deb' -o -name 'chaos_*.tar.gz' -o -name 'SHA256SUMS' \) -exec cp -v {} release/ \;
          cd release
          sha256sum chaos_*.deb chaos_*.tar.gz > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
